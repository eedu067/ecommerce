services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: ecommerce-database
    env_file:
      - .env
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - pg-data:/var/lib/postgresql/ecommerce/data

  postgres-test:
    image: postgres:18.6-bookworm
    container_name: ecommerce-database-test
    env_file:
      - .env
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - pg-data-test:/var/lib/postgresql/ecommerce-test/data

volumes:
  pg-data:
  pg-data-test: